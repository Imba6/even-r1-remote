name: Windows portable build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python tests/ui_smoke.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name EvenR1Remote --collect-submodules bleak.backends.winrt --collect-submodules pynput --copy-metadata bleak --add-data "LICENSE;." launch.py
      - run: python collect_notices.py
      - shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/EvenR1Remote.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { Stop-Process -Id $process.Id; throw 'Executable smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "Executable failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: EvenR1Remote-Windows-x64
          path: |
            dist/EvenR1Remote.exe
            LICENSE
            THIRD_PARTY.md
            requirements-lock.txt
            dist/notices/
          if-no-files-found: error

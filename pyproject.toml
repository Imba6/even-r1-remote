[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "even-r1-remote"
version = "0.1.0"
description = "Independent read-only BLE gesture remote for Windows"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["bleak>=3.0,<4", "PySide6>=6.8,<7", "pynput>=1.8,<2"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "pyinstaller>=6.16"]
[project.scripts]
even-r1-remote = "even_r1.ui:main"
even-r1-diagnostics = "even_r1.diagnostics:main"
[tool.setuptools.packages.find]
include = ["even_r1*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
